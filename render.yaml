# Render blueprint for Paperclip
#
# Drop this file at the ROOT of your Paperclip fork (sudhirkhu/paperclip)
# as `render.yaml`, then in Render dashboard:
#   New → Blueprint → connect the fork → Apply
#
# Render reads this and provisions:
#   - 1 web service (Docker, runs Paperclip server)
#   - 1 Postgres database
#   - 1 persistent disk attached to the web service
# Total monthly cost: ~$16.50 (Starter web + Starter postgres + 10GB disk).
#
# Secrets you must set in the Render dashboard AFTER first apply
# (these are `sync: false` so the blueprint apply doesn't touch them):
#   - PAPERCLIP_SECRETS_MASTER_KEY (generate: openssl rand -hex 32)
#   - AWS_ACCESS_KEY_ID            (IAM user with `bedrock:InvokeModel` perm)
#   - AWS_SECRET_ACCESS_KEY        (paired with the above)
#
# Model auth: Claude via AWS Bedrock (commercially licensed). Set
# CLAUDE_CODE_USE_BEDROCK=1 below; Claude Code (bundled into the
# Paperclip image) routes through Bedrock instead of Anthropic OAuth.
#
# Reference: https://render.com/docs/blueprint-spec

databases:
  - name: paperclip-db
    plan: free          # Render's blueprint API rejected basic_256mb and
                        # basic_1gb. Using `free` (guaranteed valid) to
                        # unblock; UPGRADE via the Render dashboard after
                        # the DB is created — the dashboard will show the
                        # current valid paid plan names.
                        # Free Postgres limits: 1GB storage, suspended on
                        # inactivity, database itself expires after 90 days
                        # without an upgrade.
    databaseName: paperclip
    user: paperclip
    # region defaults to oregon; change here if your Vercel deploy lives elsewhere

services:
  - type: web
    name: paperclip
    runtime: docker
    plan: starter
    region: oregon
    branch: master
    autoDeploy: true
    # Uses the Dockerfile at the repo root
    dockerfilePath: ./Dockerfile

    healthCheckPath: /api/health

    disk:
      name: paperclip-data
      mountPath: /paperclip
      sizeGB: 10

    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "3100"
      - key: PAPERCLIP_HOME
        value: /paperclip
      - key: PAPERCLIP_INSTANCE_ID
        value: default
      - key: PAPERCLIP_DEPLOYMENT_MODE
        value: authenticated
      - key: PAPERCLIP_DEPLOYMENT_EXPOSURE
        value: public
      - key: PAPERCLIP_API_URL
        # Set after custom domain is wired:
        # value: https://api.nucleus.watertontech.com
        # Until then, leave blank — Paperclip auto-derives from request host.
        sync: false

      # Postgres: pulled from the database resource above
      - key: DATABASE_URL
        fromDatabase:
          name: paperclip-db
          property: connectionString

      # --- Model auth: Claude via AWS Bedrock ---------------------------
      # Flips Claude Code (bundled in the Paperclip image) to Bedrock mode
      - key: CLAUDE_CODE_USE_BEDROCK
        value: "1"
      - key: AWS_REGION
        value: us-east-1   # change to whichever Bedrock region has your model access
      - key: ANTHROPIC_MODEL
        # e.g. cross-region inference profile for Claude:
        #   us.anthropic.claude-opus-4-7-20260301-v1:0
        # Pick the model you've requested access to in the Bedrock console.
        sync: false
      # -------------------------------------------------------------------

      # Secrets — set values in Render dashboard, never commit
      - key: PAPERCLIP_SECRETS_MASTER_KEY
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

      # Optional: tighter session security on a public deployment
      - key: PAPERCLIP_SECRETS_STRICT_MODE
        value: "true"
